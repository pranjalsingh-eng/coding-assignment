spring.application.name=iceandfire

server.port=8080

# Ice and Fire API Base URL
api.iceandfire.base-url=https://anapioficeandfire.com/api
api.iceandfire.page-size=50

# Output file paths
output.houses.txt=output/houses_output.txt
output.books.csv=output/books_output.csv
output.characters.excel=output/characters_output.xlsx

# REST Template timeout (ms)
api.connect-timeout=5000
api.read-timeout=15000

# Logging
logging.level.com.calsoft.iceandfire=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
